name: Validate festival config

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: CONTRACT GUARD — frozen files must exist at root
        run: |
          test -f manifest.json || { echo "::error::FROZEN /manifest.json missing — live v1 campaign would break"; exit 1; }
          test -f krishna_matki.json || { echo "::error::FROZEN /krishna_matki.json missing — live hero Lottie would break"; exit 1; }

      - name: JSON parse every *.json
        run: |
          set -e
          find . -name '*.json' -not -path './.git/*' -print0 | while IFS= read -r -d '' f; do
            echo "parse: $f"
            python -m json.tool "$f" > /dev/null
          done

      - name: Install jsonschema
        run: python -m pip install jsonschema

      - name: Schema + semantic + forbidden-pattern validation
        run: python tooling/validate.py
